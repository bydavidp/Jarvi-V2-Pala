# Patrones v4: manejo de relleno entre verbo y sustantivo.

patterns:
  - regex: "(?i)(?:que|que|dime la|cual es la|dame la|quiero saber la|sabes la|me dices la|decime la)\\s+horas?\\b"
    skill: time
    operation: get_current_time
    params: {}

  - regex: "(?i)(?:que|que|dime la|cual es la|dame la|quiero saber la|sabes|me dices la|decime la)\\s+(?:fecha|dia)\\b"
    skill: time
    operation: get_current_time
    params: {}

  - regex: "(?i)(?:pon|poner|ponme|poneme|cambia|cambiar|establece|deja|dejame)\\s+(?:el\\s+)?volumen\\s*(?:a|al|en)\\s*(\\d+)"
    skill: volume
    operation: set
    params:
      level: {group: 1, type: int}

  - regex: "(?i)(?:el\\s+)?volumen\\s*(?:a|al|en)\\s*(\\d+)"
    skill: volume
    operation: set
    params:
      level: {group: 1, type: int}

  - regex: "(?i)(sube|sub[ií]|sub[ií]le|subele|baja|baj[aá]|baj[aá]le|bajele|aumenta|aumentar|disminuye|disminuir)\\s+(?:(?:al|un|el|la|mi|poco|poquito|un\\s+poquito|todo)\\s+)*(?:volumen|sonido)"
    skill: volume
    operation: adjust
    params:
      delta: {group: 1, type: str}

  - regex: "(?i)(sube|sub[ií]|sub[ií]le|subele|baja|baj[aá]|baj[aá]le|bajele|aumenta|aumentar|disminuye|disminuir)\\s+(?:(?:al|un|el|la|mi|poco|poquito|un\\s+poquito|todo)\\s+)*(?:volumen|sonido)\\s+(\\d+)"
    skill: volume
    operation: adjust
    params:
      delta: {group: 1, type: str}
      amount: {group: 2, type: int}

  - regex: "(?i)(?:reactiva|reactivar|activa|activar|restaura|restaurar|enciende|encender|desmutea|desmutear|ponle|ponele)\\s+(?:el\\s+)?(?:sonido|audio|volumen)(?:\\s+\\S+)*|quitale\\s+el\\s+mute"
    skill: volume
    operation: unmute
    params: {}

  - regex: "(?i)(?:silencia|silenci[aá]|mutea|mutear|quita|quit[aá]|quitale|apaga|apag[aá]|apagame)\\s+(?:el\\s+)?(?:sonido|audio|volumen|ruido|mute|eso|ese|todo)(?:\\s+\\S+)*"
    skill: volume
    operation: mute
    params: {}

  - regex: "(?i)(?:abre|abr[ií]|abrir|ve|ir|carga|navega|entr[aá])\\s+(?:a|en)?\\s*(https?://\\S+)"
    skill: browser
    operation: open_url
    params:
      url: {group: 1, type: str}

  - regex: "(?i)(?:abre|abr[ií]|abrir|abreme|inicia|iniciar|lanzar|arranca|puedes\\s+abrir|podes\\s+abrir|necesito\\s+que\\s+(?:me\\s+)?abras)\\s+(?:el|la|mi)?\\s*(.+?)(?:\\s+(?:por\\s+favor|porfa))?\\s*$"
    skill: apps
    operation: open
    params:
      app_name: {group: 1, type: str}

  - regex: "(?i)(?:busca|busc[aá]|buscar|buscame|googlea|googlear|investiga|investig(?:a|á|ue)|investigame|buscame\\s+en\\s+internet|buscame\\s+en\\s+google|busca\\s+en\\s+internet|busca\\s+en\\s+google)\\s+(.+?)(?:\\s+(?:por\\s+favor|porfa))?\\s*$"
    skill: browser
    operation: search
    params:
      query: {group: 1, type: str}
