# Política de permisos: nivel base por operación de cada skill
# El evaluador solo puede SUBIR el nivel, nunca bajarlo.
# Las reglas de escalada son declarativas: policy.py evalúa condiciones
# genéricas sin conocer ninguna skill por nombre.

skills:
  time:
    get_current_time:
      level: SAFE

  volume:
    get:
      level: SAFE
    set:
      level: SYSTEM
    mute:
      level: SYSTEM

  apps:
    open:
      level: SYSTEM
      escalate:
        - condition: not_in_whitelist
          param: app_name
          to: FORBIDDEN

  browser:
    open_url:
      level: SAFE
      escalate:
        - condition: scheme_not_allowed
          param: url
          allowed_schemes: ["http", "https"]
          to: FORBIDDEN
    search:
      level: SAFE

  websearch:
    search:
      level: SAFE

  devices:
    discover:
      level: SENSITIVE
    control:
      level: SENSITIVE

  # Escritura de código confinada al sandbox de `settings.yaml` -> code.roots.
  # Va como SYSTEM (ejecuta + audit log) porque la contención la aplica la
  # propia skill: cualquier ruta fuera de las raíces se rechaza, no se pregunta.
  # Decisión autorizada por el usuario (ago 2026). Ver AGENTS.md 8.7.
  code:
    write_file:
      level: SYSTEM
    read_file:
      level: SYSTEM
    list_files:
      level: SYSTEM
    open_in_vscode:
      level: SYSTEM

