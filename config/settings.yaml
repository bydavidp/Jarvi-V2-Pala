idioma: "es"

ollama:
  url: "http://localhost:11434"
  model: "llama3.2:latest"
  keep_alive: "30m"
  timeout: 30

deepseek:
  enabled: true
  url: "https://api.deepseek.com"
  # Se elige con scripts/bench_models.py (mide latencia real de cada modelo).
  # Valor provisional: el tier "flash" es el rápido de la API.
  model: "deepseek-flash"
  models:
    - "deepseek-flash"
    - "deepseek-v4-pro"
  effort: ""        # low | high | max | vacío (default del servidor)
  timeout: 20
  primary_timeout: 10   # si DeepSeek tarda más, se responde con Ollama

llm:
  mode: "auto"           # auto | ollama
  rotation: "fastest"    # fastest | round_robin
  providers:             # orden base; el benchmark puede reordenarlo por latencia
    # "deepseek" fuera temporalmente: la cuenta tiene saldo 0 (402). Volver a añadirlo al recargar.
    - "groq"
    - "nvidia"
    - "ollama"
  switch_after_slow_ms: 4000   # NVIDIA responde en 2.4-4 s; con 2500 se aparcaba sin estar caída
  slow_trip_count: 2           # 2 lentas seguidas -> se aparca
  failure_trip_count: 2        # 2 fallos seguidos -> se aparca
  cooldown_s: 120              # cuánto queda aparcado antes de reintentar

groq:
  enabled: true
  url: "https://api.groq.com/openai/v1"
  # Modelo rápido de producción de Groq (~560 tok/s). Key en .env: GROQ_API_KEY.
  model: "llama-3.1-8b-instant"
  timeout: 20
  primary_timeout: 6

nvidia:
  enabled: true
  url: "https://integrate.api.nvidia.com/v1"
  # Se elige con scripts/bench_models.py. Requiere NVIDIA_API_KEY en .env.
  # Medido: el más rápido con JSON válido fue nemotron-3-ultra (2.9 s);
  # el "lightning" es más rápido aún (1.6 s) pero no devolvió JSON válido.
  model: "nvidia/nemotron-3-ultra-550b-a55b"
  models: []        # vacío = descubrir todos los de /models
  timeout: 30
  primary_timeout: 8

audio:
  # null = micrófono predeterminado de Windows. El índice 17 (Realtek WDM-KS) no abre con la API bloqueante.
  # Para usar el Realtek: Configuración de sonido > Entrada > dispositivo predeterminado.
  input_device: null
  output_device: null
  vad_silence_ms: 800
  vad_min_speech_ms: 300
  vad_threshold: 0.5  # probabilidad Silero VAD (0-1)
  sample_rate: 16000

whisper:
  model: "base"
  compute_type: "int8"
  language: "es"

piper:
  model_path: "models/piper/es_ES-sharvard-medium.onnx"
  binary_path: "bin/piper/piper.exe"

wakeword:
  model: "hey_jarvis_v0.1"
  sensitivity: 0.5

whitelist:
  apps:
    navegador: "chrome"
    spotify: "spotify"
    vscode: "code"
    calculadora: "calc"
    explorador: "explorer"
    terminal: "cmd"

skills:
  time:
    enabled: true

# Sandbox de la skill de código. Solo puede escribir dentro de estas raíces.
code:
  roots:
    - "%USERPROFILE%\\PROYECTOS"
  max_file_bytes: 262144        # 256 KB por archivo
  blocked_extensions: []        # vacío = lista por defecto (.exe, .bat, .ps1, ...)
  vs_code_command: "code"

